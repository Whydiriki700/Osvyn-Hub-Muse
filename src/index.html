<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Osvyn</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#101014; overflow:hidden; }
  body { font-family:"Segoe UI", system-ui, sans-serif; -webkit-user-select:none; user-select:none; }
  #bar { position:relative; display:flex; align-items:center; gap:8px; height:100%; padding:0 12px;
         overflow-x:auto; overflow-y:hidden; scrollbar-width:none; }
  #bar::-webkit-scrollbar { display:none; }
  .tab { display:flex; align-items:center; gap:8px; padding:7px 18px; border-radius:999px;
         background:#1b1b21; color:#b9b6c4; font-size:13.5px; font-weight:600; letter-spacing:.4px;
         cursor:pointer; border:1px solid #26262e; transition:all .15s; flex:none; white-space:nowrap; }
  .tab:hover { background:#23232b; color:#e8e6df; }
  .tab:active { transform:scale(.96); }
  .tab.aktif { background:#e8e6df; color:#141419; border-color:#e8e6df; }
  .tab.sibuk { opacity:.45; pointer-events:none; }
  .dot { width:8px; height:8px; border-radius:50%; background:#15b3da; flex:none; }
  .dot.tidur { background:#8a8798; }
  .x { font-size:14px; line-height:1; margin-left:2px; padding:6px 9px; border-radius:50%;
       opacity:.45; transition:opacity .15s, transform .12s ease, background-color .18s ease; cursor:pointer; }
  .x:active { transform:scale(.82); }
  .tab:hover .x { opacity:.8; }
  .x:hover { opacity:1 !important; background:rgba(220,60,60,.25); color:#ff7b7b; }
  .tab.aktif .x:hover { background:rgba(220,60,60,.2); color:#c0392b; }
  .plus { padding:7px 14px; font-size:16px; line-height:1; font-weight:700; }
  .plus.sibuk { opacity:.45; pointer-events:none; animation:denyut .8s ease-in-out infinite; }
  @keyframes denyut { 0%,100% { transform:scale(1); } 50% { transform:scale(1.22); } }
  #bar:has(#kotak-baru.tampil) #tambah { transform:rotate(45deg); background:#23232b; color:#e8e6df; }
  .kotak.tampil { animation:geserMasuk .22s ease; }
  @keyframes geserMasuk { from { opacity:0; transform:translateX(-6px); } to { opacity:1; transform:translateX(0); } }
  #status { pointer-events:none; }
  #status.menyala { position:absolute; left:50%; top:50%; z-index:5; pointer-events:auto;
                    transform:translate(-50%,-50%); background:#17171d; color:#f2f1ec;
                    border:1px solid #2e2e37; border-left:3px solid #15b3da; border-radius:999px;
                    padding:6px 16px; font-weight:600; font-size:12.5px; cursor:pointer;
                    box-shadow:0 6px 24px rgba(0,0,0,.45); animation:toastMasuk .25s ease; }
  #status.menyala:hover { border-color:#15b3da; }
  @keyframes toastMasuk { from { opacity:0; transform:translate(-50%,-46%); } to { opacity:1; transform:translate(-50%,-50%); } }
  .kotak { display:none; align-items:center; gap:8px; flex:none; }
  .kotak.tampil { display:flex; }
  .kotak input { background:#1b1b21; border:1px solid #3a3a46; border-radius:999px; color:#e8e6df;
               font-size:13.5px; font-weight:600; padding:7px 14px; outline:none; width:150px;
               font-family:inherit; }
  .kotak input:focus { border-color:#e8e6df; }
  .btn { padding:7px 16px; border-radius:999px; font-size:13px; font-weight:700; cursor:pointer;
         border:1px solid #3a3a46; background:#23232b; color:#e8e6df; flex:none;
         transition:transform .12s ease, background-color .18s ease, color .18s ease, border-color .18s ease, opacity .18s ease; }
  .btn:hover { background:#2c2c36; }
  .btn:active { transform:scale(.93); }
  .btn.bahaya { background:#5a1f1f; border-color:#7a2d2d; color:#ffb3b3; }
  .btn.bahaya:hover { background:#6d2626; }
  .petunjuk { font-size:11.5px; color:#5d5a75; white-space:nowrap; }
  #status { color:#b9b6c4; font-size:12.5px; white-space:nowrap; }
  .tab input.ren { background:transparent; border:none; outline:none; color:inherit;
                   font:inherit; width:110px; padding:0; }
  #bahasa { margin-left:auto; flex:none; background:#1b1b21; color:#b9b6c4; border:1px solid #26262e;
            border-radius:999px; padding:5px 8px; font-size:12.5px; outline:none; cursor:pointer;
            font-family:inherit; transition:transform .12s ease, background-color .18s ease, color .18s ease, border-color .18s ease; }
  #bahasa:active { transform:scale(.97); }
  .tab.terkunci { opacity:.45; }
  #paket { color:#8a8798; font-size:12px; white-space:nowrap; flex:none; letter-spacing:.3px; }
</style>
</head>

  <div id="bar">
    <div id="daftar" style="display:flex; align-items:center; gap:8px;"></div>
    <div class="tab plus" id="tambah" title="Add profile">+</div>
    <div class="kotak" id="kotak-baru">
      <input id="nama-baru" placeholder="New profile name" maxlength="30">
      <div class="btn" id="btn-buat">Create</div>
      <span class="petunjuk" id="petunjuk-baru">Enter = create &middot; Esc = cancel</span>
    </div>
    <div class="kotak" id="kotak-hapus">
      <span class="petunjuk" id="teks-hapus" style="color:#ffb3b3; font-size:12.5px;"></span>
      <div class="btn bahaya" id="btn-hapus">Delete</div>
      <div class="btn" id="btn-batal-hapus">Cancel</div>
    </div>
    <span id="status"></span>
    <div class="tab" id="tombol-hub" title="Hub">Hub</div>
    <div class="tab" id="tombol-tidur-semua" title="Sleep all profiles" style="display:none">Sleep all</div>
    <span id="paket"></span>
    <select id="bahasa" aria-label="Language">

  var bahasa = 'en';
  var T = KATA.en;
  var invoke = window.__TAURI__.core.invoke;
  var daftar = [];
  var aktif = null;
  var calonHapus = null;
  var statusEl = document.getElementById('status');
  var timerToast = null;
  window.__toastUnduhan = function(teks) {
    statusEl.textContent = teks;
    statusEl.classList.add('menyala');
    statusEl.dataset.unduhan = '1';
    statusEl.title = T.dlOpen || '';
    if (timerToast) clearTimeout(timerToast);
    timerToast = setTimeout(function(){
      statusEl.textContent = '';
      statusEl.classList.remove('menyala');
      delete statusEl.dataset.unduhan;
      statusEl.title = '';
    }, 4500);
  };
  statusEl.addEventListener('click', function(){
    if (statusEl.dataset.unduhan && statusEl.classList.contains('menyala')) {
      invoke('buka_lokasi_unduhan');
    }
  });

  function terapkanBahasa(kode) {
    if (!KATA[kode]) kode = 'en';
    bahasa = kode; T = KATA[kode];
    // Kata baru v0.1.4 (Hub/gerbang) belum diterjemahkan ke semua
    // bahasa; yang belum ada memakai Inggris.
    ['hubLock','sleepAll','sleepingAll','dlOpen'].forEach(function(k){
      if (!T[k]) T[k] = KATA.en[k];
    });
    document.documentElement.lang = kode;
    document.getElementById('tambah').title = T.add;
    document.getElementById('tombol-tidur-semua').textContent = T.sleepAll;
    document.getElementById('tombol-tidur-semua').title = T.sleepAll;
    document.getElementById('nama-baru').placeholder = T.ph;
    document.getElementById('btn-buat').textContent = T.create;
    document.getElementById('petunjuk-baru').textContent = T.hint;
    document.getElementById('btn-hapus').textContent = T.del;
    document.getElementById('btn-batal-hapus').textContent = T.cancel;
    document.getElementById('bahasa').value = kode;
    render();
  }
  document.getElementById('bahasa').addEventListener('change', function(){
    terapkanBahasa(this.value);
    invoke('simpan_bahasa', { kode: this.value }).catch(function(){});
  });

  function buatTab(p) {
    var el = document.createElement('div');
    el.className = 'tab';
    el.id = 'tab-' + p.id;
    var dot = document.createElement('span'); dot.className = 'dot';
    var label = document.createElement('span'); label.className = 'lbl'; label.textContent = p.nama;
    var x = document.createElement('span'); x.className = 'x'; x.textContent = '\u00d7';
    x.title = T.delTitle;
    x.addEventListener('click', function(e){
      e.stopPropagation();
      mintaHapus(el._p);
    });
    el.appendChild(dot); el.appendChild(label); el.appendChild(x);
    el.addEventListener('click', function(){
      // Deteksi klik-dua manual berbasis id profil (state klikTerakhir),
      // bukan identitas node — node tab kini dipakai ulang antar-render,
      // jadi handler membaca profil mutakhir dari el._p.
      var p = el._p;
      var kini = Date.now();
      if (klikTerakhir.id === p.id && kini - klikTerakhir.t < 450) {
        klikTerakhir = { id: null, t: 0 };
        rename(el, p);
      } else {
        klikTerakhir = { id: p.id, t: kini };
        pilih(p.id);
      }
    });
    el.addEventListener('dblclick', function(){ rename(el, el._p); });
    return el;
  }

  // Render memakai ulang node tab yang sudah ada (kelas .aktif dan
  // label diperbarui di tempat) supaya transisi CSS tab benar-benar
  // berjalan; versi lama membangun ulang semua node tiap render
  // (innerHTML='') sehingga tidak ada animasi tab yang bisa hidup.
  function render() {
    var wadah = document.getElementById('daftar');
    var terlihat = {};
    daftar.forEach(function(p) {
      terlihat[p.id] = true;
      var el = document.getElementById('tab-' + p.id);
      if (el && !el.querySelector('.lbl')) { el.remove(); el = null; }
      if (!el) {
        el = buatTab(p);
      } else {
        el.querySelector('.lbl').textContent = p.nama;
        // Judul tombol x ikut bahasa aktif; tanpa ini judulnya
        // membeku di bahasa saat tab dibuat (regresi render hemat
        // node v0.2.5, ketahuan skenario langbar 29 Okt).
        var xEl = el.querySelector('.x');
        if (xEl) xEl.title = T.delTitle || '';
      }
      el._p = p;
      el.className = 'tab' + (p.id === aktif ? ' aktif' : '');
      wadah.appendChild(el);
    });
    Array.prototype.slice.call(wadah.children).forEach(function(el) {
      if (!terlihat[el.id.replace('tab-', '')]) el.remove();
    });
  }

  var klikTerakhir = { id: null, t: 0 };

  function pilih(id) {
    if (id === aktif) return;
    aktif = id;
    render();
    invoke('ganti_profil', { profil: id });
  }

  function rename(el, p) {
    var input = document.createElement('input');
    input.className = 'ren'; input.value = p.nama; input.maxLength = 30;
    el.innerHTML = ''; el.appendChild(input);
    input.focus(); input.select();
    var selesai = false;
    function tutup(simpan) {
      if (selesai) return; selesai = true;
      var baru = input.value.trim();
      if (simpan && baru && baru !== p.nama) {
        invoke('ganti_nama', { id: p.id, nama: baru }).then(function(){
          p.nama = baru; render();
        }).catch(function(){ render(); });
      } else { render(); }
    }
    input.addEventListener('keydown', function(e){
      if (e.key === 'Enter') tutup(true);
      if (e.key === 'Escape') tutup(false);
      e.stopPropagation();
    });
    input.addEventListener('blur', function(){ tutup(true); });
    input.addEventListener('click', function(e){ e.stopPropagation(); });
    input.addEventListener('dblclick', function(e){ e.stopPropagation(); });
  }

  function mintaHapus(p) {
    if (daftar.length <= 1) {
      document.getElementById('teks-hapus').textContent = T.last;
      calonHapus = null;
    } else {
      document.getElementById('teks-hapus').textContent =
        T.confirm.replace('{name}', p.nama);
      calonHapus = p;
    }
    document.getElementById('kotak-baru').classList.remove('tampil');
    document.getElementById('kotak-hapus').classList.add('tampil');
  }

  document.getElementById('btn-batal-hapus').addEventListener('click', function(){
    calonHapus = null;
    document.getElementById('kotak-hapus').classList.remove('tampil');
  });

  document.getElementById('btn-hapus').addEventListener('click', function(){
    if (!calonHapus) {
      document.getElementById('kotak-hapus').classList.remove('tampil');
      return;
    }
    var target = calonHapus;
    calonHapus = null;
    document.getElementById('kotak-hapus').classList.remove('tampil');
    // Respons seketika (perbaikan 28 Okt): tab hilang dari bar saat itu
    // juga dan status tampil; penghapusan data berjalan di latar Rust.
    var cadangan = daftar.slice();
    var aktifLama = aktif;
    daftar = daftar.filter(function(p){ return p.id !== target.id; });
    if (aktif === target.id) aktif = daftar.length ? daftar[0].id : null;
    render();
    statusEl.textContent = T.deleting;
    invoke('hapus_profil', { id: target.id }).then(function(){
      statusEl.textContent = '';
    }).catch(function(err){
      daftar = cadangan; aktif = aktifLama; render();
      statusEl.textContent = '';
      alert(T.failDel + err);
    });
  });

  document.getElementById('tambah').addEventListener('click', function(){
    document.getElementById('kotak-hapus').classList.remove('tampil');
    var kotak = document.getElementById('kotak-baru');
    kotak.classList.add('tampil');
    var input = document.getElementById('nama-baru');
    input.value = '';
    input.focus();
  });

  var sedangBuat = false;
  function buatProfil() {
    if (sedangBuat) return;
    sedangBuat = true;
    var input = document.getElementById('nama-baru');
    var nama = input.value.trim();
    document.getElementById('kotak-baru').classList.remove('tampil');
    document.getElementById('tambah').classList.add('sibuk');
    statusEl.textContent = T.creating;
    invoke('tambah_profil', { nama: nama }).then(function(cfg){
      daftar.push(cfg);
      aktif = cfg.id;
      render();
    }).catch(function(err){
      sedangBuat = false;
      document.getElementById('tambah').classList.remove('sibuk');
      statusEl.textContent = '';
      alert(T.failAdd + err);
    });
  }

  document.getElementById('btn-buat').addEventListener('click', buatProfil);

  var inputBaru = document.getElementById('nama-baru');
  inputBaru.addEventListener('keydown', function(e){
    if (e.key === 'Enter') buatProfil();
    if (e.key === 'Escape') {
      document.getElementById('kotak-baru').classList.remove('tampil');
    }
    e.stopPropagation();
  });

  document.addEventListener('keydown', function(e) {
    if (e.ctrlKey && /^[1-9]$/.test(e.key)) {
      var idx = parseInt(e.key, 10) - 1;
      if (daftar[idx]) pilih(daftar[idx].id);
    }
  });

  Promise.all([invoke('daftar_profil'), invoke('profil_aktif'), invoke('ambil_bahasa')]).then(function(h){
    daftar = h[0] || [];
    aktif = h[1] && daftar.some(function(p){ return p.id === h[1]; })
      ? h[1] : (daftar.length ? daftar[0].id : null);
    terapkanBahasa(h[2] || 'en');
  });

  // Gerbang tingkat (v0.1.4): label paket di bar + tombol Hub + kontrol
  // Tidurkan semua. Penegakan aslinya di inti Rust; di sini tampilannya.
  var infoPaket = null;
  invoke('info_paket').then(function(info){
    infoPaket = info;
    var label = info.nama + ' · ' + info.terpakai + '/' + (info.batas === null ? '∞' : info.batas);
    document.getElementById('paket').textContent = label;
    var hubBtn = document.getElementById('tombol-hub');
    if (!info.hub) hubBtn.classList.add('terkunci');
    if (info.fitur_lanjut) {
      document.getElementById('tombol-tidur-semua').style.display = '';
    }
  }).catch(function(){});

  document.getElementById('tombol-hub').addEventListener('click', function(){
    if (infoPaket && !infoPaket.hub) {
      statusEl.textContent = T.hubLock;
      setTimeout(function(){ statusEl.textContent = ''; }, 3200);
      return;
    }
    invoke('buka_hub').catch(function(err){
      statusEl.textContent = String(err);
      setTimeout(function(){ statusEl.textContent = ''; }, 3200);
    });
  });

  var tidurSemuaJalan = false;
  document.getElementById('tombol-tidur-semua').addEventListener('click', function(){
    if (tidurSemuaJalan) return;
    tidurSemuaJalan = true;
    var tombol = document.getElementById('tombol-tidur-semua');
    tombol.classList.add('sibuk');
    statusEl.textContent = T.sleepingAll;
    invoke('tidurkan_semua').then(function(){
      statusEl.textContent = '';
      segarkanTitikTidur();
    }).catch(function(err){
      statusEl.textContent = String(err);
      setTimeout(function(){ statusEl.textContent = ''; }, 3200);
    }).finally(function(){
      tidurSemuaJalan = false;
      tombol.classList.remove('sibuk');
    });
  });

  // DeepSleep: titik tab profil yang sedang tidur jadi abu. Polling
  // ringan; hanya mengubah kelas titik, tidak me-render ulang tab.
  function segarkanTitikTidur(){
    invoke('profil_tidur').then(function(tidur){
      daftar.forEach(function(p){
        var el = document.getElementById('tab-' + p.id);
        if (!el) return;
        var dot = el.querySelector('.dot');
        if (!dot) return;
        var sedangTidur = tidur.indexOf(p.id) >= 0;
        dot.classList.toggle('tidur', sedangTidur);
        el.title = sedangTidur ? T.sleeping : '';
      });
    }).catch(function(){});
  }
  setInterval(segarkanTitikTidur, 4000);
</script>
</body>
</html>
