<!DOCTYPE html>

<style>
  :root{ --ink:#101014; --ink-2:#3c3f47; --ink-3:#83878f; --garis:#e2e2e8; --biru:#2b6ff2; --biru-gelap:#1e56c8; --cyan:#15b3da; --merah:#c62f3b; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html, body{ height:100%; }
  body{ font-family:"Segoe UI", system-ui, sans-serif; background:#ffffff; color:var(--ink);
        display:flex; align-items:center; justify-content:center; -webkit-user-select:none; user-select:none; }
  #bahasa{ position:fixed; top:16px; inset-inline-end:16px; font-size:13px; color:var(--ink-2);
           border:1px solid var(--garis); border-radius:9px; padding:6px 8px; background:#fff; outline:none; cursor:pointer; }
  .kotak{ width:440px; max-width:92vw; text-align:center; padding:24px; }
  .nama{ font-family:Poppins, "Segoe UI", system-ui, sans-serif; font-weight:700; font-size:44px; letter-spacing:-1px; }
  .nama .titik{ display:inline-block; width:11px; height:11px; border-radius:50%; background:var(--cyan); margin-left:4px; }
  .jargon{ font-size:13.5px; color:var(--ink-3); margin-top:2px; }
  .judul{ font-size:19px; font-weight:600; margin-top:38px; }
  .penjelas{ font-size:14px; line-height:1.65; color:var(--ink-2); margin-top:10px; }
  label{ display:block; text-align:start; font-size:13px; font-weight:600; margin:26px 0 8px; }
  input#kunci{ width:100%; border:1px solid var(--garis); border-radius:12px; padding:13px 14px;
            font-family:Consolas, "Courier New", monospace; font-size:13px; line-height:1.4;
            outline:none; color:var(--ink); background:#fbfbfc; }
  input#kunci:focus{ border-color:var(--biru); background:#fff; }
  button{ width:100%; margin-top:14px; background:var(--biru); color:#fff; border:none; border-radius:12px;
          padding:14px; font-size:15px; font-weight:600; cursor:pointer;
          transition:transform .12s ease, background-color .18s ease, opacity .18s ease, box-shadow .18s ease; }
  button:hover{ background:var(--biru-gelap); }
  button:active{ transform:scale(.97); }
  button:disabled{ opacity:.5; cursor:default; }
  button:disabled:active{ transform:none; }
  #bahasa{ transition:transform .12s ease, border-color .18s ease, background-color .18s ease; }
  #bahasa:active{ transform:scale(.97); }
  .galat{ display:none; margin-top:14px; font-size:13.5px; color:var(--merah); line-height:1.55; }
  .kaki{ margin-top:26px; font-size:12.5px; color:var(--ink-3); line-height:1.7; }
  .berhasil{ display:none; }
  .berhasil .judul{ color:var(--biru-gelap); margin-top:38px; }
</style>
</head>

  var bahasa = 'en';
  var invoke = window.__TAURI__.core.invoke;
  var tombol = document.getElementById('tombol');
  var area = document.getElementById('kunci');
  var galat = document.getElementById('galat');
  var pemilih = document.getElementById('bahasa');

  function terapkan(kode) {
    if (!KATA[kode]) kode = 'en';
    bahasa = kode;
    var k = KATA[kode];
    document.documentElement.lang = kode;
    document.documentElement.dir = (kode === 'ar') ? 'rtl' : 'ltr';
    document.getElementById('t-jargon').textContent = k.jargon;
    document.getElementById('t-judul').textContent = k.judul;
    document.getElementById('t-penjelas').textContent = k.penjelas;
    document.getElementById('t-label').textContent = k.label;
    tombol.textContent = k.tombol;
    document.getElementById('t-kaki1').textContent = k.kaki1;
    document.getElementById('t-kaki2').textContent = k.kaki2;
    document.getElementById('t-berhasil-judul').textContent = k.berhasilJudul;
    pemilih.value = kode;
  }
  terapkan('en');
  invoke('ambil_bahasa').then(function(kode){ terapkan(kode); }).catch(function(){});
  pemilih.addEventListener('change', function(){
    terapkan(pemilih.value);
    invoke('simpan_bahasa', { kode: pemilih.value }).catch(function(){});
  });

  function tampilGalat(pesan) {
    galat.textContent = pesan;
    galat.style.display = 'block';
    tombol.disabled = false;
    tombol.textContent = KATA[bahasa].tombol;
  }
  function terjemahGalat(e) {
    var s = String(e), k = KATA[bahasa];
    if (s.indexOf('Invalid key') === 0) return k.errInvalid;
    if (s.indexOf('Unknown key format') === 0) return k.errFormat;
    if (s.indexOf('Unsupported key version') === 0) return k.errVersion;
    if (s.indexOf('Failed to save') === 0) return k.errSave;
    return s;
  }
  tombol.addEventListener('click', function () {
    var kunci = area.value.trim();
    if (!kunci) { tampilGalat(KATA[bahasa].kosong); return; }
    galat.style.display = 'none';
    tombol.disabled = true;
    tombol.textContent = KATA[bahasa].memeriksa;
    invoke('aktivasi_kunci', { kunci: kunci })
      .then(function (tingkat) {
        document.getElementById('formulir').style.display = 'none';
        var b = document.getElementById('berhasil');
        b.style.display = 'block';
        document.getElementById('teks-berhasil').textContent =
          KATA[bahasa].berhasilTeks.replace('{tier}', tingkat);
      })
      .catch(function (e) { tampilGalat(terjemahGalat(e)); });
  });
  area.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') { tombol.click(); }
  });
